device: auto
pipeline:
  completion:
    max_area_growth_ratio: 4.0
    max_bbox_growth_ratio: 9.0
    minimum_hole_area_pixels: 16
    minimum_hole_area_ratio: 0.01
    tie_tolerance_ratio: 0.1
  reconstruction:
    context_ratio: 0.25
models:
  matting:
    active: birefnet
    birefnet:
      model_id: "ZhengPeng7/BiRefNet"
      trust_remote_code: true
      resolution: [1024, 1024]
  inpainting:
    active: lama
    lama:
      # SimpleLama tự động quản lý trọng số
      dummy: true
      generation_mask_expansion: 21
      composition_mask_expansion: 15
      feather_radius: 2.0
    sdxl:
      model_id: "runwayml/stable-diffusion-inpainting"
      use_xformers: false
      cpu_offload: true
      strength: 0.55
      num_inference_steps: 30
      guidance_scale: 3.5
      generation_mask_expansion: 17
      composition_mask_expansion: 11
      feather_radius: 2.0
      prompt: "empty seamless continuation of the existing background, matching the surrounding texture, color, lighting, and perspective"
      negative_prompt: "object, person, animal, furniture, decoration, text, watermark, new detail, artifact, blur, distorted pattern"
  segmentation:
    active: sam3
    sam3:
      checkpoint_path: "checkpoints/sam3.pt"
      confidence_threshold: 0.5
      load_from_hf: false
  completion:
    active: sdamodal
    sdamodal:
      config_path: "backend/models/completion/config_SDAmodal.yaml"
      checkpoint_path: "backend/models/completion/checkpoints/SDAmodal.pth"
      input_size: 512
      enlarge_box: 3.0
      lazy_load: true
