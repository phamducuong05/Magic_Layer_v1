device: auto
logging:
  level: INFO
  workflow_detail: compact
  third_party_level: WARNING
pipeline:
  completion:
    max_area_growth_ratio: 4.0
    max_bbox_growth_ratio: 9.0
    minimum_hole_area_pixels: 16
    minimum_hole_area_ratio: 0.01
    tie_tolerance_ratio: 0.1
  object_reconstruction:
    # A tighter crop reduces foreground-occluder distraction for HD-Painter.
    context_ratio: 0.15
    generation_mask_dilation_pixels: 12
    generation_mask_closing_pixels: 7
    support_margin_pixels: 8
    # Completion-hole components must remain connected to an occluder within
    # this small geometric margin before they can enter reconstruction_mask.
    composition_margin_pixels: 4
    # HD-Painter Poisson blending dilates its mask by roughly 24/2048 pixels.
    blend_allowance_ratio: 0.012
    prompt_template: "Reconstruct only the hidden continuation of the {target} behind {occluders}, matching the visible target's color, texture, lighting, and geometry. Do not recreate {occluders}."
    # Leave empty for photos. This project currently processes flat artwork,
    # so explicitly discourage HD-Painter's photographic/soft texture bias.
    style_hint: "Match the source's flat vector illustration style with crisp edges, solid consistent colors, and no blur."
    color_refinement_enabled: true
    color_refinement_strength: 0.2
    # Set to a directory path to save per-object source/mask/output PNGs.
    diagnostics_directory: outputs/reconstruction_debug
  matting:
    context_ratio: 0.25
    support_dilation_pixels: 2
  diagnostics:
    enabled: true
    log_summary: true
    track_peak_gpu_memory: true
models:
  matting:
    active: birefnet
    birefnet:
      model_id: "ZhengPeng7/BiRefNet"
      trust_remote_code: true
      resolution: [1024, 1024]
  object_reconstruction:
    active: hd_painter
    hd_painter:
      model_id: ds8_inp
      method: painta+rasg
      input_size: 512
      num_steps: 50
      guidance_scale: 7.5
      rasg_eta: 0.1
      seed: 1
      positive_prompt: "high quality, coherent object continuation"
      negative_prompt: "artifact, duplicate parts, malformed geometry, text, watermark"
      fp16: true
      # Keep only the active HD-Painter stage on GPU. This preserves the
      # 512px + 2048px quality path on 16GB cards at the cost of transfer time.
      sequential_cpu_offload: true
      auto_download: true
      checkpoint_root: checkpoints
      super_resolution:
        enabled: false
        # Crops below this size use the 512px generation directly. Upscaling
        # them to 2048px and immediately shrinking them adds avoidable latency.
        minimum_roi_size: 640
        target_size: 2048
        noise_level: 20
        denoising_stride: 50
        guidance_scale: 7.5
        blend_trick: true
        blend_output: true
        use_sam_mask: false
        prompt_suffix: "high resolution, crisp edges, consistent colors"
  background_inpainting:
    active: lama
    lama:
      # SimpleLama tự động quản lý trọng số
      dummy: true
      generation_mask_expansion: 21
      composition_mask_expansion: 15
      feather_radius: 2.0
    sdxl:
      model_id: "runwayml/stable-diffusion-inpainting"
      use_xformers: false
      cpu_offload: true
      strength: 0.55
      num_inference_steps: 30
      guidance_scale: 3.5
      generation_mask_expansion: 17
      composition_mask_expansion: 11
      feather_radius: 2.0
      prompt: "empty seamless continuation of the existing background, matching the surrounding texture, color, lighting, and perspective"
      negative_prompt: "object, person, animal, furniture, decoration, text, watermark, new detail, artifact, blur, distorted pattern"
  segmentation:
    active: sam3
    sam3:
      checkpoint_path: "checkpoints/sam3.pt"
      confidence_threshold: 0.5
      load_from_hf: false
  completion:
    active: sdamodal
    sdamodal:
      config_path: "backend/models/completion/config_SDAmodal.yaml"
      checkpoint_path: "backend/models/completion/checkpoints/SDAmodal.pth"
      input_size: 512
      enlarge_box: 3.0
      lazy_load: true
